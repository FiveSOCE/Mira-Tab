name: Release v0.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 036f0daa183a8dbbd1d5d023fcddda4f9c7f1e92

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 \
            build/libs/MiraTab-0.1.1.jar \
            --target 036f0daa183a8dbbd1d5d023fcddda4f9c7f1e92 \
            --title "MiraTab v0.1.1" \
            --notes "Makes the factions-style tab layout the default: centered ★ MIRA FACTIONS ★ header, play.mira.gg subtitle, clean LuckPerms prefix + username + MiraTags suffix player rows, online/max-player footer, and mira.gg branding. Native Minecraft connection indicators remain at the far right instead of duplicating numeric ping in the player name."
