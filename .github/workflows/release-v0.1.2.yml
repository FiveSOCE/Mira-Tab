name: Release v0.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 65093b645f3a6a888e33a495200597b5d31bffd2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 \
            build/libs/MiraTab-0.1.2.jar \
            --target 65093b645f3a6a888e33a495200597b5d31bffd2 \
            --title "MiraTab v0.1.2" \
            --notes "Makes the factions-style tab layout the default and safely migrates untouched v0.1.0 configs on upgrade. Custom layouts are preserved. Default header is ★ MIRA FACTIONS ★ with play.mira.gg, player rows remain LuckPerms prefix + username + MiraTags suffix, and the footer shows online/max players with mira.gg branding."
